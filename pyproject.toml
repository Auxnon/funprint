[project]
name = "funprint"
version = "0.3.0"
description = "Print images on Fun Print (cat-printer protocol) BLE thermal printers"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = ["bleak>=0.22", "pillow>=10"]

[project.scripts]
print = "funprint:main"
funprint = "funprint:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
